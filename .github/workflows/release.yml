# Сборка установщика Windows в ЧЕРНОВИК релиза.
# Запуск: Actions → Release → Run workflow (можно на любой ветке, например из PR)
# или тег vX.Y.Z. Версия берётся из package.json.
# Черновик видите только вы: скачайте exe, проверьте, прочитайте заметки, затем
# на странице релиза нажмите «Publish release» с галочкой «Set as the latest release».
# Pult у пользователей видит только опубликованные релизы, черновики — нет.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version
        id: v
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: npx electron-vite build && npx electron-builder --win --x64 --publish never

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          name: Pult ${{ steps.v.outputs.tag }}
          files: |
            dist/*.exe
          body_path: .github/release-notes/${{ steps.v.outputs.tag }}.md
