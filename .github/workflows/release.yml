# Сборка установщика Windows и публикация релиза.
# Запускается тегом вида v0.3.2: git tag v0.3.2 && git push origin v0.3.2
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npx electron-vite build && npx electron-builder --win --x64 --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          body_path: .github/release-notes/${{ github.ref_name }}.md
