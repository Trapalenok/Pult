<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#0A6CFF"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0A1A5C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- network links behind the shield -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round">
    <line x1="512" y1="300" x2="230" y2="250"/>
    <line x1="512" y1="300" x2="794" y2="250"/>
    <line x1="512" y1="560" x2="250" y2="760"/>
    <line x1="512" y1="560" x2="774" y2="760"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="230" cy="250" r="34"/><circle cx="794" cy="250" r="34"/>
    <circle cx="250" cy="760" r="34"/><circle cx="774" cy="760" r="34"/>
  </g>
  <g fill="#30D158"><circle cx="230" cy="250" r="16"/><circle cx="794" cy="250" r="16"/><circle cx="250" cy="760" r="16"/></g>
  <circle cx="774" cy="760" r="16" fill="#FF9F0A"/>
  <!-- shield -->
  <path filter="url(#ds)" fill="url(#sh)" d="M512 214 L716 290 Q724 293 724 302 L724 486 Q724 676 512 790 Q300 676 300 486 L300 302 Q300 293 308 290 Z"/>
