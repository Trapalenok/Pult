  <g stroke="#2F5BFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="408,420 486,476 408,532"/>
    <line x1="530" y1="562" x2="618" y2="562"/>
  </g>
